<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário CEP</title>
</head>
<body>

  <h2>Formulário de Endereço</h2>

  <form>
    <div></div>
    <label for="cep">CEP:</label>
    <input type="text" id="cep" maxlength="8" placeholder="Digite o CEP:">
    </div>
<div>
    <label for="rua">Rua:</label>
    <input type="text" id="rua" placeholder="Digite a Rua:">
</div>
   
<div>
    <label for="numero">Número:</label>
    <input type="number" id="numero" placeholder="Digite o Número:">
</div>
    
<div>
    <label for="bairro">Bairro:</label>
    <input type="text" id="bairro" placeholder="Digite o Bairro:">
</div>
    
<div>
    <label for="cidade">Cidade:</label>
    <input type="text" id="cidade" placeholder="Digite a Cidade:">
</div>
   <div>

    <label for="estado">Estado:</label>
    <input type="text" id="estado" placeholder="Digite o Estado:">
</div>
   <div>

    <label for="complemento">Complemento:</label>
    <input type="text" id="complemento" placeholder="Digite o Complemento:">
</div>
    <div>

    <button type="submit">Enviar</button>
</div>
  </form>
</body>
</html>
